<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forge — AI Academic Planner</title>
    <meta name="description" content="Your AI-powered academic operating system." />
    <meta property="og:title" content="Forge" />
    <meta property="og:description" content="Your AI-powered academic operating system." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <!-- Satoshi font via Fontshare CDN -->
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
    <link href="https://api.fontshare.com/v2/css?f[]=satoshi@700,600,500,400,300&display=swap" rel="stylesheet" />
    <script>
      // ── Theme + Glass Intensity — applied before first paint to avoid flash ──
      try {
        var t = localStorage.getItem('forge-theme');
        document.documentElement.classList.add(t === 'light' ? 'light' : 'dark');
      } catch(e) {
        document.documentElement.classList.add('dark');
      }
      try {
        // Mirror of applyGlassIntensity() — 3-point: Frost(0) Neutral(50) Glass(100)
        var gi = localStorage.getItem('forgeGlassIntensity');
        var n  = gi !== null ? Math.max(0, Math.min(100, Number(gi))) : 50;
        var blur = (Math.max(4, 40 - n * 0.36)).toFixed(1) + 'px';
        var bgD  = Math.max(0.03, 0.30 - n * 0.0027);
        var bgL  = Math.max(0.06, 0.60 - n * 0.0054);
        var bgBD = Math.min(0.50, bgD  * 1.7);
        var bgBL = Math.min(0.80, bgL  * 1.4);
        var bgAD = Math.min(0.60, bgD  * 2.4);
        var bgAL = Math.min(0.88, bgL  * 1.6);
        var boD  = Math.max(0.10, 0.38 - n * 0.0028);
        var boL  = Math.max(0.08, 0.22 - n * 0.0014);
        var shA  = Math.max(0.05, 0.22 - n * 0.0017);
        function wh(a){return 'rgba(255,255,255,'+a.toFixed(3)+')';}
        function dk(a){return 'rgba(0,0,0,'+a.toFixed(3)+')';}
        var r = document.documentElement;
        r.style.setProperty('--glass-intensity',        String(n));
        r.style.setProperty('--glass-blur',             blur);
        r.style.setProperty('--glass-bg-dark',          wh(bgD));
        r.style.setProperty('--glass-bg-btn-dark',      wh(bgBD));
        r.style.setProperty('--glass-bg-active-dark',   wh(bgAD));
        r.style.setProperty('--glass-border-dark',      wh(boD));
        r.style.setProperty('--glass-bg-light',         wh(bgL));
        r.style.setProperty('--glass-bg-btn-light',     wh(bgBL));
        r.style.setProperty('--glass-bg-active-light',  wh(bgAL));
        r.style.setProperty('--glass-border-light',     dk(boL));
        r.style.setProperty('--glass-shadow',
          '0 8px 32px rgba(0,0,0,'+shA.toFixed(3)+'), 0 2px 8px rgba(0,0,0,'+(shA*0.55).toFixed(3)+')');
      } catch(e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
