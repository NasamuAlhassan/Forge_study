<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forge — AI Academic Planner</title>
    <meta name="description" content="Your AI-powered academic operating system." />
    <meta property="og:title" content="Forge" />
    <meta property="og:description" content="Your AI-powered academic operating system." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <!-- Satoshi font via Fontshare — async/non-blocking load -->
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
    <link rel="preload" href="https://api.fontshare.com/v2/css?f[]=satoshi@700,600,500,400,300&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=satoshi@700,600,500,400,300&display=swap" /></noscript>
    <script>
      // ── Theme + Glass Intensity — applied before first paint to avoid flash ──
      try {
        var t = localStorage.getItem('forge-theme');
        document.documentElement.classList.add(t === 'light' ? 'light' : 'dark');
      } catch(e) {
        document.documentElement.classList.add('dark');
      }
      try {
        // Mirror of applyGlassIntensity() — blue-tinted dark glass + white light glass
        var gi = localStorage.getItem('forgeGlassIntensity');
        var n  = gi !== null ? Math.max(0, Math.min(100, Number(gi))) : 50;
        var blur = (Math.max(2, 22 - n * 0.20)).toFixed(1) + 'px';
        // Dark: blue glass  n=0→0.35  n=50→0.22  n=100→0.08
        var bgD  = Math.max(0.08, 0.35  - n * 0.0027);
        var bgL  = Math.max(0.45, 0.80  - n * 0.0035);
        var bgBD = Math.min(0.55, bgD   * 1.7);
        var bgBL = Math.min(0.90, bgL   + 0.18);
        var bgAD = Math.min(0.72, bgD   * 2.5);
        var bgAL = Math.min(0.96, bgL   + 0.30);
        var boD  = Math.max(0.10, 0.32  - n * 0.0022);
        var boL  = Math.max(0.14, 0.24  - n * 0.001);
        var shA  = Math.max(0.14, 0.32  - n * 0.0018);
        // Dark mode — blue glass helpers
        function gl(a) {return 'rgba(25,65,185,'+a.toFixed(3)+')';}
        function glB(a){return 'rgba(30,75,200,'+a.toFixed(3)+')';}
        function glA(a){return 'rgba(45,110,245,'+a.toFixed(3)+')';}
        function brd(a){return 'rgba(140,180,255,'+a.toFixed(3)+')';}
        // Light mode — white frost + soft-blue border/active
        function wh(a) {return 'rgba(255,255,255,'+a.toFixed(3)+')';}
        function brdL(a){return 'rgba(80,130,220,'+a.toFixed(3)+')';}
        function glAL(a){return 'rgba(255,255,255,'+a.toFixed(3)+')';}
        var r = document.documentElement;
        r.style.setProperty('--glass-intensity',        String(n));
        r.style.setProperty('--glass-blur',             blur);
        r.style.setProperty('--glass-bg-dark',          gl(bgD));
        r.style.setProperty('--glass-bg-btn-dark',      glB(bgBD));
        r.style.setProperty('--glass-bg-active-dark',   glA(bgAD));
        r.style.setProperty('--glass-border-dark',      brd(boD));
        r.style.setProperty('--glass-bg-light',         wh(bgL));
        r.style.setProperty('--glass-bg-btn-light',     wh(bgBL));
        r.style.setProperty('--glass-bg-active-light',  glAL(bgAL));
        r.style.setProperty('--glass-border-light',     brdL(boL));
        r.style.setProperty('--glass-shadow',
          '0 8px 32px rgba(4,8,45,'+shA.toFixed(3)+'), 0 2px 8px rgba(4,8,45,'+(shA*0.55).toFixed(3)+')');
      } catch(e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
